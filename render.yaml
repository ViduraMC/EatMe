# Render Blueprint for the production API. See RELEASE.md for the full walkthrough.
#
# The database is not defined here on purpose: DATABASE_URL points at a managed
# PostgreSQL (Neon, Singapore region, recommended in RELEASE.md), so the API can
# move hosts without moving the data.
services:
  - type: web
    name: eatme-api
    runtime: node
    # Singapore is the closest Render region to Sri Lanka.
    region: singapore
    # Starter, not free: a free service sleeps after 15 minutes and takes about
    # a minute to wake, longer than the app's 15 second request timeout.
    plan: starter
    branch: release/play-store
    rootDir: server
    # --include=dev because NODE_ENV=production would otherwise skip
    # typescript and the prisma CLI, which the build and migrations need.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Migrations run on every start; "migrate deploy" only applies new ones and
    # never resets data.
    startCommand: npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: '*'
      # Proxies between the internet and the app. Check it after the first
      # deploy (RELEASE.md step 3) and adjust in the dashboard if needed.
      - key: TRUST_PROXY_HOPS
        value: '1'
